# Comparator software manifest: parsed by paths.py (configparser), rebuilt from by install.sh.
# sha256 is the checksum of the executed artifact. It is a gate only where enforce_sha = yes; a
# binary rebuilt from source is not bit-reproducible, so its sha256 is provenance only.

[shaep]
name          = ShaEP
version       = 1.4.0
build_id      = 1.4.0.04f349e55e6deb118159ddaddcb5fa81dc75b4bb 64-bit build Jun 29 2024
license       = free for academic use; BINARY ONLY, no source released
citation      = Vainio, Puranen & Johnson, JCIM 2009, 49, 492. doi:10.1021/ci800315d
obtain        = wayback
url           = https://web.archive.org/web/20241228132449id_/http://users.abo.fi/mivainio/shaep/Linux_64bit-ShaEP.zip
archive_sha256 = eeb77a0bccd027d2ea78e62bedb8fbf14e7e6902a3640c1f5365390192072a0a
sha256        = 6f91f3289a79fbbe79f8a886d7cf766ceafe56786616ba96ebd9f9620a0e23dc
enforce_sha   = yes
# Do not commit the ShaEP binary to this repo (academic-use-only licence, no redistribution right).

